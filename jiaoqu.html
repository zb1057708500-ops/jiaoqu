<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骚区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #222222;
            color: #fff;
            font-family: "Microsoft Yahei", sans-serif;
            padding: 30px 15px;
        }
        .page-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 32px;
            color: #ffdddd;
        }
        .img-wrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 1800px;
            margin: 0 auto 40px;
        }
        .img-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .desc-box {
            max-width: 1200px;
            margin: 0 auto;
            text-align:center;
            font-size: 22px;
            color: #eeeeee;
            line-height:1.8;
        }
        /* 手机端自动变成竖排 */
        @media (max-width: 900px) {
            .img-wrap {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1 class="page-title">骚区</h1>
    <div class="img-wrap">
        <div class="img-item">
            <!-- 第一张 比耶wink -->
            <img src="img1.jpg" alt="伪人1">
        </div>
        <div class="img-item">
            <!-- 第二张 蹲下吐舌头 -->
            <img src="img2.jpg" alt="伪人2">
        </div>
        <div class="img-item">
            <!-- 第三张 白丝脚 -->
            <img src="img3.jpg" alt="伪人3">
        </div>
    </div>
    <div class="desc-box">
        我是交区<br>
        爸爸！我可爱吗！
    </div>
</body>
</html>
